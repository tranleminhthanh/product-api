name: Product API Production CI

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: CI - TEST PRODUCT API
  # ==========================================
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Start Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          node index.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Healthcheck Product API
        run: |
          for i in {1..12}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done
          cat app.log
          exit 1

      # TEST SCRIPT
      - name: Run Node test script
        run: npm test

      # TEST CREATE
      - name: Test CREATE Product
        run: |
          curl --fail \
            -X POST \
            http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{
              "pid": "P001",
              "pname": "Laptop",
              "price": 1000000,
              "quantity": 12
            }'

      # TEST READ
      - name: Test READ Product
        run: |
          curl --fail \
            http://localhost:3000/api/products/P001

      # TEST UPDATE
      - name: Test UPDATE Product
        run: |
          curl --fail \
            -X PUT \
            http://localhost:3000/api/products/P001 \
            -H "Content-Type: application/json" \
            -d '{
              "pname": "Gaming Laptop",
              "price": 180000,
              "quantity": 5
            }'

      # TEST DELETE
      - name: Test DELETE Product
        run: |
          curl --fail \
            -X DELETE \
            http://localhost:3000/api/products/P001

  # ==========================================
  # JOB 2: BUILD AND PUSH - CHAY SONG SONG
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 3: CD - DEPLOY VE LAPTOP
  # ==========================================
  deploy-local:
    needs: [test-product-api, build-and-push]

    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Pull latest Product API image
        run: docker pull tranleminhthanh/product-api:latest

      - name: Deploy Product API
        run: docker compose -p product-api -f "C:\Users\ADMIN\Desktop\LTHDV\product-api\docker-compose-prod.yaml" up -d --no-deps product-api

      - name: Check containers
        run: docker compose -p product-api -f "C:\Users\ADMIN\Desktop\LTHDV\product-api\docker-compose-prod.yaml" ps
