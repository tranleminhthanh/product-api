name: Product API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7

        ports:
          - 27017:27017

        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Lấy source code từ GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Cài Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Cài thư viện
      - name: Install dependencies
        run: npm ci

      # Chạy API và kiểm tra
      - name: Test Product API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          node index.js &
          sleep 5
          curl --fail http://localhost:3000
